name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  firmware:
    name: Firmware build and host tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio
          key: ${{ runner.os }}-platformio-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build firmware
        working-directory: firmware
        run: pio run -e seeed_xiao

      - name: Build and run firmware host tests
        working-directory: firmware/host_tests
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel
          ctest --test-dir build --build-config Release --output-on-failure

  software:
    name: Desktop tool build and tests
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore software/MaimaiTouchTool.sln

      - name: Build
        run: dotnet build software/MaimaiTouchTool.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test software/MaimaiTouchTool.sln --configuration Release --no-build --logger "console;verbosity=normal"
